name: Notify workflow repo

# The native branch's trigger for BP-Decomp_Workflow's "Byte-match summary" Action
# (.github/workflows/bytematch.yml there). Dispatch every newly pushed x360 commit,
# oldest first, as `b5-x360-push`; the workflow joins the committed byte-match
# records with that commit and refreshes the dashboard. dev keeps its own copy of
# this file, which dispatches `b5-decomp-push` to the reconcile Action instead.
#
# Setup (one-time, shared with dev): this repo's WORKFLOW_DISPATCH_TOKEN secret, a
# token that can send repository_dispatch to BurnoutDecomp/BP-Decomp_Workflow.
# Missing credentials fail visibly.

on:
  push:
    branches: [x360]

concurrency:
  group: notify-workflow-x360
  queue: max
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
      WORKFLOW_REPO: ${{ github.repository_owner }}/BP-Decomp_Workflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      - name: Trigger the byte-match summary in BP-Decomp_Workflow
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'WORKFLOW_DISPATCH_TOKEN is required'; exit 1; }
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA"; then
            # New branches and rewritten histories reconcile the current head.
            commits="$GITHUB_SHA"
          else
            commits="$(git rev-list --reverse "$BEFORE..$GITHUB_SHA")"
          fi
          for sha in $commits; do
            delivered=false
            for attempt in 1 2 3; do
              if gh api --method POST -H "Accept: application/vnd.github+json" \
                "/repos/${WORKFLOW_REPO}/dispatches" -f event_type=b5-x360-push \
                -F "client_payload[sha]=$sha"; then
                delivered=true; break
              fi
              sleep 5
            done
            test "$delivered" = true || exit 1
            echo "dispatched b5-x360-push for $sha"
          done
