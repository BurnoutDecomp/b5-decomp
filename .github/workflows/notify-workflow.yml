name: Notify workflow repo

# Optional event-driven trigger for BP-Decomp_Workflow's "Reconcile status + submodule
# pointer" Action. On every push to dev, fire a repository_dispatch at the workflow repo
# so it bumps its b5-decomp submodule pointer and regenerates progress/status.json from
# the coordination server immediately — instead of waiting for the hourly schedule.
#
# Setup (one-time):
#   1. Create a fine-grained PAT (or classic token with `repo` scope) that can send
#      repository_dispatch to Adriwin06/BP-Decomp_Workflow.
#   2. Add it to THIS repo's secrets as WORKFLOW_DISPATCH_TOKEN.
# Without the secret the step is skipped, so this file is harmless until configured.
# The workflow repo also runs hourly, so this is a latency optimization, not required.

on:
  push:
    branches: [dev]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
    steps:
      - name: Trigger reconcile in BP-Decomp_Workflow
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/Adriwin06/BP-Decomp_Workflow/dispatches \
            -f event_type=b5-decomp-push \
            -F "client_payload[sha]=${GITHUB_SHA}"
          echo "dispatched b5-decomp-push for ${GITHUB_SHA} (workflow repo will reconcile)"
