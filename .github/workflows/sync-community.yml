name: Sync community metadata

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/community.json
      - .github/workflows/sync-community.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: community-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create missing labels and milestones
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.getContent({
              owner, repo, path: '.github/community.json', ref: context.sha
            });
            const config = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            // Validate the complete configuration before making any changes.
            for (const key of ['labels', 'milestones']) {
              if (!Array.isArray(config[key])) throw new Error(`Missing ${key} array`);
              const field = key === 'labels' ? 'name' : 'title';
              const names = config[key].map(item => item[field]?.toLowerCase());
              if (names.some(name => !name) || new Set(names).size !== names.length)
                throw new Error(`Invalid or duplicate ${key}`);
            }
            for (const label of config.labels) {
              if (!/^[0-9a-f]{6}$/i.test(label.color) || label.name.length > 50 ||
                  typeof label.description !== 'string' || label.description.length > 100)
                throw new Error(`Invalid label ${label.name}`);
            }
            for (const milestone of config.milestones) {
              if (typeof milestone.description !== 'string') throw new Error('Missing milestone description');
            }
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 });
            const labelNames = new Set(labels.map(label => label.name.toLowerCase()));
            for (const label of config.labels) {
              if (!labelNames.has(label.name.toLowerCase())) {
                await github.rest.issues.createLabel({ owner, repo, ...label });
                core.info(`Created label: ${label.name}`);
              }
            }
            const milestones = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all', per_page: 100 });
            const titles = new Set(milestones.map(milestone => milestone.title.toLowerCase()));
            for (const milestone of config.milestones) {
              if (!titles.has(milestone.title.toLowerCase())) {
                await github.rest.issues.createMilestone({ owner, repo, ...milestone });
                core.info(`Created milestone: ${milestone.title}`);
              }
            }
            await core.summary.addRaw('Community labels and milestones checked; existing metadata preserved.').write();
