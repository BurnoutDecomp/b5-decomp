name: Game bug or crash
description: Tell us about a problem, even if it only happened once.
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Give your issue a short, descriptive title. Everything below is optional - share what you have.
        A title and a screenshot of an error are enough to start. If a glitch was too quick to capture, a short description is welcome too.
        You do not need to know the cause or how to reproduce it. You can add more details later.
        If you can, check [existing issues](https://github.com/BurnoutDecomp/b5-decomp/issues?q=is%3Aissue) for a matching report.
  - type: textarea
    id: actual
    attributes:
      label: What happened? (optional)
      description: A sentence or two is fine. What were you doing? Did it happen once or several times? If you know how to trigger it, include those steps.
      placeholder: The screen went black for about half a second after a few minutes of driving, then returned to normal. It only happened once and I don't know what triggered it.
  - type: upload
    id: evidence
    attributes:
      label: Screenshot or video (optional)
      description: An error/assert screenshot is especially helpful. Attach a clip if you already have one, but don't worry if you missed a brief glitch.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
  - type: textarea
    id: details
    attributes:
      label: Anything else? (optional)
      description: Add any details you think matter, such as error text, logs, mods or computer specs. No checklist to complete. Remove private information from logs; don't attach game files or full memory dumps.
